{% set name = "grass" %}
{% set version = "8.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For local testing, build from the repository checkout
  path: ..
  # For conda-forge submission, replace with a tarball URL and sha256
  # url: https://github.com/OSGeo/grass/archive/refs/tags/grass-{{ version }}.tar.gz
  # sha256: <fill-in>

build:
  number: 0
  skip: false  # [win]
  # GRASS uses Autotools configure/make; build.sh handles the steps

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - pkg-config
    - bison
    - flex
    - gettext
  host:
    - python
    - pip
    - gdal
    - geos
    - proj
    - proj-data
    - sqlite
    - readline
    - ncurses
    - cairo
    - freetype
    - fontconfig
    - expat
    - pixman
    - xorg-libx11
    - xorg-xproto
    - xorg-kbproto
    - xorg-xextproto
    - xorg-renderproto
    - libpng
    - libjpeg-turbo
    - libtiff
    - zlib
    - zstd
    - bzip2
    - libpq
    - jsoncpp
    - libmagic
    - fftw
    - openblas
    - liblapack
    - libnetcdf
    - pdal
    - libiconv
  run:
    - python
    - libiconv
    - gdal
    - geos
    - proj
    - proj-data
    - sqlite
    - readline
    - ncurses
    - cairo
    - freetype
    - fontconfig
    - expat
    - libpng
    - libjpeg-turbo
    - libtiff
    - zlib
    - zstd
    - bzip2
    - libpq
    - jsoncpp
    - libmagic
    - fftw
    - openblas
    - liblapack
    - libnetcdf
    - pdal
    # Python modules typically used by GRASS python tools
    - numpy
    - pillow
    - matplotlib
    - python-dateutil
    - ply
    - psycopg2
    - python-magic

test:
  commands:
    - grass --version
    - grass --tmp-project EPSG:4326 --exec g.version -rge
  requires:
    - pip

about:
  home: https://grass.osgeo.org/
  summary: Geographic Resources Analysis Support System (GRASS GIS)
  description: |
    GRASS GIS is a free and open-source Geographic Information System (GIS)
    used for geospatial data management and analysis, image processing, and spatial modeling.
  license: GPL-2.0-only
  license_file:
    - GPL.TXT
    - COPYING
  doc_url: https://grass.osgeo.org/learn/
  dev_url: https://github.com/OSGeo/grass

extra:
  recipe-maintainers:
    - your-github-handle
